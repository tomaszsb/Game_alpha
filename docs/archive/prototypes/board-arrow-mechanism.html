<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 20px; }
  h2 { margin: 30px 0 10px; font-size: 16px; }
  .diagram { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 30px; }
  svg text { font-family: -apple-system, sans-serif; }
</style>
</head>
<body>
<h1 style="font-size:18px;">How the Board Arrow System Works</h1>

<h2>Step 1: CSS Flexbox lays out the tiles</h2>
<div class="diagram">
<svg width="700" height="320" viewBox="0 0 700 320">
  <!-- Branch rows -->
  <rect x="40" y="20" width="620" height="40" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="10" y="44" font-size="10" fill="#e65100" font-weight="bold">B0</text>
  <rect x="40" y="78" width="620" height="40" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="10" y="102" font-size="10" fill="#2e7d32" font-weight="bold">B1</text>
  <rect x="40" y="136" width="620" height="40" rx="4" fill="#e3f2fd" stroke="#2196f3" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="10" y="160" font-size="10" fill="#1565c0" font-weight="bold">B2</text>

  <!-- Gap labels -->
  <text x="670" y="68" font-size="9" fill="#999" text-anchor="end">18px gap</text>
  <line x1="660" y1="60" x2="660" y2="62" stroke="#999" stroke-width="1"/>
  <line x1="660" y1="76" x2="660" y2="78" stroke="#999" stroke-width="1"/>
  <line x1="658" y1="61" x2="662" y2="61" stroke="#999"/>
  <line x1="658" y1="77" x2="662" y2="77" stroke="#999"/>

  <!-- Tiles in B0 -->
  <rect x="60" y="27" width="74" height="26" rx="4" fill="#fff" stroke="#ff9800" stroke-width="2"/>
  <text x="97" y="44" font-size="9" text-anchor="middle" fill="#333">Tile A</text>
  <rect x="180" y="27" width="74" height="26" rx="4" fill="#fff" stroke="#ff9800" stroke-width="2"/>
  <text x="217" y="44" font-size="9" text-anchor="middle" fill="#333">Tile B</text>

  <!-- Tiles in B1 -->
  <rect x="60" y="85" width="74" height="26" rx="4" fill="#fff" stroke="#4caf50" stroke-width="2"/>
  <text x="97" y="102" font-size="9" text-anchor="middle" fill="#333">Tile C</text>
  <rect x="180" y="85" width="74" height="26" rx="4" fill="#fff" stroke="#4caf50" stroke-width="2"/>
  <text x="217" y="102" font-size="9" text-anchor="middle" fill="#333">Tile D</text>
  <rect x="300" y="85" width="74" height="26" rx="4" fill="#fff" stroke="#4caf50" stroke-width="2"/>
  <text x="337" y="102" font-size="9" text-anchor="middle" fill="#333">Tile E</text>

  <!-- Tiles in B2 -->
  <rect x="60" y="143" width="74" height="26" rx="4" fill="#fff" stroke="#2196f3" stroke-width="2"/>
  <text x="97" y="160" font-size="9" text-anchor="middle" fill="#333">Tile F</text>
  <rect x="180" y="143" width="74" height="26" rx="4" fill="#fff" stroke="#2196f3" stroke-width="2"/>
  <text x="217" y="160" font-size="9" text-anchor="middle" fill="#333">Tile G</text>

  <!-- Arrow: AFTER layout -->
  <text x="350" y="30" font-size="12" fill="#d32f2f" font-weight="bold">&#x2460; CSS positions tiles first</text>
  <text x="350" y="100" font-size="11" fill="#555">Each branch = independent flex row</text>
  <text x="350" y="115" font-size="11" fill="#555">gap: 18px between rows</text>
  <text x="350" y="155" font-size="11" fill="#555">Tiles never move after layout</text>

  <!-- Step 2 label -->
  <rect x="40" y="200" width="620" height="100" rx="6" fill="#fafafa" stroke="#ccc"/>
  <text x="55" y="225" font-size="12" fill="#d32f2f" font-weight="bold">&#x2461; drawArrows() measures tile positions with getBoundingClientRect()</text>
  <text x="55" y="248" font-size="11" fill="#555">&#x2192; Builds rects{} map: { tileA: {left, right, top, bottom, cx, cy}, ... }</text>
  <text x="55" y="268" font-size="11" fill="#555">&#x2192; Routes SVG paths between tiles, avoiding obstacles</text>
  <text x="55" y="288" font-size="11" fill="#555">&#x2192; Draws on transparent SVG overlay (pointer-events: none)</text>
</svg>
</div>

<h2>Step 2: Return arrow routing uses gaps between branches</h2>
<div class="diagram">
<svg width="700" height="400" viewBox="0 0 700 400">
  <!-- PM Check on the left -->
  <rect x="30" y="60" width="74" height="30" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="67" y="79" font-size="9" text-anchor="middle" fill="#1565c0" font-weight="bold">PM Check</text>

  <!-- Branch 0 (Funding) -->
  <rect x="150" y="20" width="500" height="50" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>
  <text x="155" y="35" font-size="9" fill="#e65100" font-weight="bold">Branch 0 (Funding)</text>
  <rect x="170" y="32" width="60" height="24" rx="3" fill="#fff" stroke="#ff9800" stroke-width="1.5"/>
  <text x="200" y="48" font-size="8" text-anchor="middle">Tile</text>
  <rect x="260" y="32" width="60" height="24" rx="3" fill="#fff" stroke="#ff9800" stroke-width="1.5"/>
  <text x="290" y="48" font-size="8" text-anchor="middle">Tile</text>

  <!-- Gap 0-1 -->
  <rect x="150" y="70" width="500" height="18" rx="2" fill="#e8eaf6" opacity="0.4"/>
  <text x="400" y="83" font-size="9" fill="#5c6bc0" text-anchor="middle" font-weight="bold">gap (18px) &#x2190; midY for Branch 0 return arrows</text>

  <!-- Branch 1 (Architecture) - EXPANDED -->
  <rect x="150" y="88" width="500" height="90" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>
  <text x="155" y="103" font-size="9" fill="#2e7d32" font-weight="bold">Branch 1 (Architecture) &#x2014; has expanded card</text>
  <rect x="170" y="105" width="60" height="24" rx="3" fill="#fff" stroke="#4caf50" stroke-width="1.5"/>
  <text x="200" y="121" font-size="8" text-anchor="middle">Tile</text>
  <!-- Expanded card -->
  <rect x="260" y="100" width="140" height="70" rx="3" fill="#fff" stroke="#495057" stroke-width="2"/>
  <text x="330" y="120" font-size="9" text-anchor="middle" fill="#212529" font-weight="bold">Expanded Card</text>
  <text x="330" y="133" font-size="8" text-anchor="middle" fill="#666">180px wide</text>
  <text x="330" y="146" font-size="8" text-anchor="middle" fill="#666">Story + Action</text>
  <text x="330" y="159" font-size="8" text-anchor="middle" fill="#666">(taller row)</text>

  <!-- 24px dynamic margin -->
  <rect x="640" y="178" width="4" height="24" fill="#e91e63"/>
  <text x="648" y="194" font-size="8" fill="#e91e63" font-weight="bold">+24px margin</text>

  <!-- Gap 1-2 (wider due to margin) -->
  <rect x="150" y="202" width="500" height="30" rx="2" fill="#e8eaf6" opacity="0.4"/>
  <text x="400" y="221" font-size="9" fill="#5c6bc0" text-anchor="middle" font-weight="bold">enlarged gap (18px + 24px margin) &#x2190; midY for Branch 1 return</text>

  <!-- Branch 2 -->
  <rect x="150" y="232" width="500" height="50" rx="4" fill="#e3f2fd" stroke="#2196f3" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>
  <text x="155" y="247" font-size="9" fill="#1565c0" font-weight="bold">Branch 2 (Engineering)</text>
  <rect x="170" y="244" width="60" height="24" rx="3" fill="#fff" stroke="#2196f3" stroke-width="1.5"/>
  <text x="200" y="260" font-size="8" text-anchor="middle">Tile</text>
  <rect x="260" y="244" width="60" height="24" rx="3" fill="#fff" stroke="#2196f3" stroke-width="1.5"/>
  <text x="290" y="260" font-size="8" text-anchor="middle">Tile</text>
  <rect x="350" y="244" width="60" height="24" rx="3" fill="#fff" stroke="#2196f3" stroke-width="1.5"/>
  <text x="380" y="260" font-size="8" text-anchor="middle">Scope Chk</text>

  <!-- Return arrow from Branch 2 -->
  <!-- Exit right from Scope Check -->
  <line x1="410" y1="256" x2="440" y2="256" stroke="#7b1fa2" stroke-width="2.5" marker-end="none"/>
  <!-- Vertical down to midY (gap between Branch 1 and 2) -->
  <line x1="440" y1="256" x2="440" y2="217" stroke="#7b1fa2" stroke-width="2.5"/>
  <!-- Horizontal left through gap to PM Check approach -->
  <line x1="440" y1="217" x2="120" y2="217" stroke="#7b1fa2" stroke-width="2.5"/>
  <!-- Vertical up to PM Check -->
  <line x1="120" y1="217" x2="120" y2="75" stroke="#7b1fa2" stroke-width="2.5"/>
  <!-- Enter PM Check -->
  <line x1="120" y1="75" x2="104" y2="75" stroke="#7b1fa2" stroke-width="2.5"/>
  <polygon points="104,75 110,72 110,78" fill="#7b1fa2"/>

  <!-- Label the arrow path -->
  <text x="445" y="240" font-size="8" fill="#7b1fa2" font-weight="bold">1. exit right</text>
  <text x="445" y="215" font-size="8" fill="#7b1fa2" font-weight="bold">2. up to midY</text>
  <text x="250" y="212" font-size="8" fill="#7b1fa2" font-weight="bold" text-anchor="middle">3. left through gap (no tiles here!)</text>
  <text x="108" y="150" font-size="8" fill="#7b1fa2" font-weight="bold" transform="rotate(-90,108,150)">4. up to PM Check</text>

  <!-- Explanation -->
  <text x="30" y="310" font-size="11" fill="#333" font-weight="bold">Key insight:</text>
  <text x="30" y="328" font-size="10" fill="#555">&#x2022; midY is placed in the gap BETWEEN branches (computed from branchYBounds)</text>
  <text x="30" y="344" font-size="10" fill="#555">&#x2022; The horizontal segment at midY crosses all branches but stays in the gap &#x2192; no tile overlaps</text>
  <text x="30" y="360" font-size="10" fill="#555">&#x2022; Dynamic CSS margin (+24px) on expanded rows ensures gaps stay large enough</text>
  <text x="30" y="376" font-size="10" fill="#555">&#x2022; edgeX (vertical channel) checks ALL tiles to avoid passing through any branch</text>
</svg>
</div>

<h2>Step 3: Obstacle avoidance (hitsBoxV / hitsBoxH)</h2>
<div class="diagram">
<svg width="700" height="280" viewBox="0 0 700 280">
  <!-- Two tiles -->
  <rect x="100" y="80" width="74" height="30" rx="4" fill="#fff" stroke="#4caf50" stroke-width="2"/>
  <text x="137" y="99" font-size="9" text-anchor="middle">Source</text>
  <rect x="400" y="140" width="74" height="30" rx="4" fill="#fff" stroke="#2196f3" stroke-width="2"/>
  <text x="437" y="159" font-size="9" text-anchor="middle">Target</text>

  <!-- Obstacle tile -->
  <rect x="240" y="90" width="80" height="50" rx="4" fill="#ffebee" stroke="#f44336" stroke-width="2"/>
  <text x="280" y="112" font-size="9" text-anchor="middle" fill="#c62828">Expanded</text>
  <text x="280" y="124" font-size="9" text-anchor="middle" fill="#c62828">Card</text>
  <!-- Margin around obstacle -->
  <rect x="234" y="84" width="92" height="62" rx="6" fill="none" stroke="#f44336" stroke-width="1" stroke-dasharray="3" opacity="0.5"/>
  <text x="280" y="82" font-size="7" fill="#f44336" text-anchor="middle">+6px margin</text>

  <!-- Bad path (through obstacle) -->
  <line x1="174" y1="95" x2="400" y2="155" stroke="#f44336" stroke-width="1.5" stroke-dasharray="4" opacity="0.4"/>
  <text x="300" y="70" font-size="9" fill="#f44336">&#x2718; Direct path blocked</text>

  <!-- Good path (L-shape around) -->
  <polyline points="174,95 174,155 400,155" fill="none" stroke="#4caf50" stroke-width="2.5"/>
  <polygon points="400,155 394,152 394,158" fill="#4caf50"/>
  <text x="110" y="135" font-size="9" fill="#4caf50" font-weight="bold">&#x2714; Route around</text>

  <!-- Explanation -->
  <text x="30" y="200" font-size="11" fill="#333" font-weight="bold">hitsBoxV(x, yMin, yMax) / hitsBoxH(y, xMin, xMax):</text>
  <text x="30" y="218" font-size="10" fill="#555">&#x2022; Checks if a line segment passes through any tile's bounding box (+ 6px margin)</text>
  <text x="30" y="234" font-size="10" fill="#555">&#x2022; findClearX / findClearY scans in 5px increments to find a clear path</text>
  <text x="30" y="250" font-size="10" fill="#555">&#x2022; routeAroundBoxes tries L-shape, then Z-shape fallback</text>
  <text x="30" y="266" font-size="10" fill="#555">&#x2022; Pass 2 separates parallel overlapping arrow segments by color</text>
</svg>
</div>

</body>
</html>
