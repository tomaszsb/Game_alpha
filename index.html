<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#007bff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Unravel">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <title>Unravel Codes: The Game</title>
    <style>
        /* Global touch optimization - remove 300ms tap delay on mobile */
        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f5f5f5;
        }

        #root {
            height: 100vh;
            width: 100vw;
        }

        /* Loading indicator */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 18px;
            color: #666;
            text-align: center;
            padding: 20px;
            gap: 16px;
            box-sizing: border-box;
        }

        .loading-tip {
            display: none;
            font-size: 14px;
            color: #888;
            max-width: 420px;
            line-height: 1.5;
        }

        /* Error fallback */
        .error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #dc3545;
            text-align: center;
            padding: 20px;
        }

        .error h1 {
            margin-bottom: 10px;
        }

        .error button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">
            <div>Loading Unravel Codes...</div>
            <!-- Hidden by default; revealed by the timeout check below if
                 loading is still stuck after 10s. Some TV browsers hang
                 indefinitely trying to run this game rather than throwing a
                 script error the fallback below could catch — confirmed
                 live 2026-07-15 on a real TV stuck on this exact screen,
                 with no console access on-device to see why. -->
            <div id="loading-tip" class="loading-tip">
                Taking longer than 10 seconds? Some TV browsers can't run this game well.
                Try installing a different browser on your TV — <strong>TV Bro</strong> and
                <strong>Browsehere</strong> are known to work — from your TV's app store, then open this page there.
            </div>
        </div>
    </div>

    <!-- Load the React application -->
    <script type="module" src="src/main.tsx"></script>

    <!-- Error/timeout handling for module loading failures — moved out of an
         inline <script> block so it's an ordinary same-origin file, which
         keeps the CSP's script-src at 'self' with no 'unsafe-inline' and no
         hash to maintain by hand (see server.js's security-headers block). -->
    <script src="/error-handler.js"></script>
</body>
</html>
