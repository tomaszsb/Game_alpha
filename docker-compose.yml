# Game Alpha - Docker Compose
# Run: docker-compose up -d



services:
  game-alpha:
    build: .
    container_name: game-alpha
    ports:
      - "3000:3000"   # Frontend
      - "3001:3001"   # Backend API
    restart: unless-stopped
    env_file:
      - .env  # Must contain ADMIN_PASSWORD_HASH (see .env.example)
    volumes:
      - game-data:/app/data  # Persistent storage for games and logs

volumes:
  game-data:
