# Game Alpha - Docker Compose
# Run: docker-compose up -d

version: '3.8'

services:
  game-alpha:
    build: .
    container_name: game-alpha
    ports:
      - "3000:3000"   # Frontend
      - "3001:3001"   # Backend API
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NTFY_TOPIC=unravel-game-alerts  # Change this to your own topic!
      # Admin password hash (SHA-256). Default password: "unravel2026"
      # Generate new: node -e "console.log(require('crypto').createHash('sha256').update('YOUR_PASSWORD').digest('hex'))"
      # - ADMIN_PASSWORD_HASH=your_sha256_hash_here
    volumes:
      - game-data:/app/data  # Persistent storage for games and logs

volumes:
  game-data:
