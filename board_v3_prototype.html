            pts.push(start, { x: stubX, y: start.y }, { x: stubX, y: entryY }, { x: entryX, y: entryY });
          } else {
            pts.splice(pts.length - 2, 2,
              { x: stubX, y: prev.y },
              { x: stubX, y: entryY },
              { x: entryX, y: entryY }
            );
          }
        }
      }

      // ---- Pass 3: render SVG ----
      let svgHTML = '<defs>';
      const usedColors = new Set(edgePaths.map(e => e.color));
      for (const c of usedColors) {
        const id = 'arr-' + c.replace('#', '');
        svgHTML += `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">`;
        svgHTML += `<path d="M 0 0 L 10 5 L 0 10 z" fill="${c}"/>`;
        svgHTML += '</marker>';
      }
      svgHTML += '</defs>';

      for (const ep of edgePaths) {
        const { pts, color, isMerge } = ep;
        const mid = 'arr-' + color.replace('#', '');
        const d = smoothPath(pts);
        if (isMerge) {
          // Merge connector: no arrowhead, just a line joining the shared channel
          svgHTML += `<path class="svg-edge" d="${d}" stroke="${color}"/>`;
        } else {
          svgHTML += `<path class="svg-edge" d="${d}" stroke="${color}" marker-end="url(#${mid})"/>`;
        }
      }

      svg.innerHTML = svgHTML;
    }

    // ===================================================================
    // FULL RENDER
    // ===================================================================
    function renderAll() {
      if (document.getElementById('showVisited').checked) {
        const idx = ALL_SPACES.indexOf(currentSpace);
        visitedSpaces = new Set(ALL_SPACES.slice(0, Math.max(idx, 1)));
      } else {
        visitedSpaces = new Set([currentSpace]);
      }

      renderTiles();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          drawArrows();
        });
      });

      // Status bar
      document.getElementById('status-bar').innerHTML =
        `<strong>Spaces:</strong> ${ALL_SPACES.length} | <strong>Edges:</strong> ${EDGES.length} | <strong>Path segments:</strong> ${GAME_PATH.length} | <strong>Current:</strong> ${currentSpace}`;
    }

    // ===================================================================
    // CONTROLS
    // ===================================================================
    function setupControls() {
      const selectEl = document.getElementById('currentSelect');
      selectEl.innerHTML = '';
      for (const s of ALL_SPACES) {
        selectEl.innerHTML += `<option value="${s}">${shortName(s)}</option>`;
      }
      selectEl.value = currentSpace;
      selectEl.addEventListener('change', () => { currentSpace = selectEl.value; renderAll(); });
      document.getElementById('showVisited').addEventListener('change', () => renderAll());

      // Player position controls
      const pcDiv = document.getElementById('player-controls');
      let pcHTML = '';
      for (let i = 0; i < PLAYER_COLORS.length; i++) {
        const pc = PLAYER_COLORS[i];
        pcHTML += `<div class="player-control">`;
        pcHTML += `<div class="dot" style="background:${pc.bg}"></div>`;
        pcHTML += `<select id="player-${i}"><option value="">(none)</option>`;
        for (const s of ALL_SPACES) {
          pcHTML += `<option value="${s}">${shortName(s)}</option>`;
        }
        pcHTML += `</select></div>`;
      }
      pcDiv.innerHTML = pcHTML;
      for (let i = 0; i < PLAYER_COLORS.length; i++) {
        const sel = document.getElementById(`player-${i}`);
        sel.addEventListener('change', () => {
          playerPositions[i] = sel.value || null;
          renderAll();
        });
      }
    }

    // ===================================================================
    // RESIZE
    // ===================================================================
    let resizeTimer;
    new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderAll, 100);
    }).observe(document.getElementById('map-container'));

    // ===================================================================
    // INIT — load CSVs, build path, render
    // ===================================================================
    async function init() {
      const basePath = '/data/CLEAN_FILES/';
      const [movementRows, configRows, diceRows, contentRows] = await Promise.all([
        fetchCSV(basePath + 'MOVEMENT.csv'),
        fetchCSV(basePath + 'GAME_CONFIG.csv'),
        fetchCSV(basePath + 'DICE_OUTCOMES.csv'),
        fetchCSVQuoted(basePath + 'SPACE_CONTENT.csv'),
      ]);

      // Build lookup maps
      for (const r of configRows) configMap[r.space_name] = r;
      configRows.forEach((r, i) => { configOrder[r.space_name] = i; });
      for (const r of movementRows) {
        if (!movementMap[r.space_name]) movementMap[r.space_name] = {};
        movementMap[r.space_name][r.visit_type] = r;
      }
      for (const r of diceRows) {
        if (!diceMap[r.space_name]) diceMap[r.space_name] = {};
        diceMap[r.space_name][r.visit_type] = r;
      }

      // PHASE_MAP from config
      const PHASE_DISPLAY = { SETUP: 'OWNER' };
      for (const r of configRows) {
        const raw = r.phase;
        PHASE_MAP[r.space_name] = PHASE_DISPLAY[raw] || raw;
      }

      // CONTENT from SPACE_CONTENT
      for (const r of contentRows) {
        if (!CONTENT[r.space_name]) CONTENT[r.space_name] = {};
        CONTENT[r.space_name][r.visit_type] = {
          title: r.title || r.space_name,
          story: r.story || '',
          action: r.action_description || '',
        };
      }

      // Build data-driven path
      const { path, placed, getMovement, getDiceReachable } = buildGamePathFromData(movementRows, configRows, diceRows);
      GAME_PATH = path;
      EDGES = buildEdges();
      ALL_SPACES = getAllSpaceNames();

      // Add edges TO convergence nodes from game data (cross-branch arrows)
      // e.g. CON-INSPECT → REG-DOB-FINAL-REVIEW
      CONVERGENCE_NODES = new Set();
      for (const seg of GAME_PATH) {
        if (seg.type === 'fork') {
          for (const br of seg.branches) {
            for (const item of br.nodes) {
              if (typeof item === 'object' && item.type === 'convergence') {
                CONVERGENCE_NODES.add(item.name);
              }
            }
          }
        }
      }
      if (CONVERGENCE_NODES.size > 0) {
        // Find which nodes are in the same branch as each convergence node
        const convergenceBranchNodes = new Set();
        for (const seg of GAME_PATH) {
          if (seg.type === 'fork') {
            for (const br of seg.branches) {
              const flat = flattenBranchNodes(br.nodes);
              if (flat.some(n => CONVERGENCE_NODES.has(n))) {
                flat.forEach(n => convergenceBranchNodes.add(n));
              }
            }
          }
        }
        // Only add edges TO convergence from nodes NOT in the same branch
        const edgeSet = new Set(EDGES.map(([a, b]) => a + '->' + b));
        for (const name of ALL_SPACES) {
          if (CONVERGENCE_NODES.has(name)) continue;
          if (convergenceBranchNodes.has(name)) continue; // same branch — skip
          const mov = getMovement(name);
          const dests = mov.type === 'dice' ? getDiceReachable(name) : mov.destinations;
          for (const dest of dests) {
            if (CONVERGENCE_NODES.has(dest) && !edgeSet.has(name + '->' + dest)) {
              EDGES.push([name, dest]);
              edgeSet.add(name + '->' + dest);
            }
          }
        }
      }

      // Validation
      const configSpaces = configRows.filter(r => r.space_name !== 'START-QUICK-PLAY-GUIDE').map(r => r.space_name);
      const unplaced = configSpaces.filter(s => !placed.has(s));
      if (unplaced.length > 0) {
        console.warn(`[Board v3] ${unplaced.length} spaces not placed:`, unplaced);
      }
      console.log(`[Board v3] Placed ${placed.size}/${configSpaces.length} spaces`);
      console.log('[Board v3] GAME_PATH:', GAME_PATH);
      console.log('[Board v3] EDGES:', EDGES);

      // Initial state
      currentSpace = ALL_SPACES.find(s => s === 'ARCH-INITIATION') || ALL_SPACES[0];

      setupControls();
      renderAll();
    }

    init().catch(err => {
      console.error('[Board v3] Init failed:', err);
      document.getElementById('status-bar').innerHTML = `<strong style="color:red">Error:</strong> ${err.message}. Run via dev server (npx vite dev).`;
    });
  </script>
